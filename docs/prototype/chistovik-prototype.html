<title>Чистовик</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Раскладка по ответам со стенда: левая рейка (А), экраны с сеткой приводки, тёмная тема по умолчанию. Лайм только для живого: запись, выполнение, активное состояние. */
:root{
  --bg:#0E0E0F; --panel:#141416; --panel2:#1C1C1E; --panel3:#242428; --line:#26262A; --line2:#3A3A40;
  --ink:#EDEBE6; --ink2:#B9B7B0; --ink3:#8A8A90;
  --live:#D7FF3C; --on-live:#0E0E0F; --accent-text:#D7FF3C;
  --inv:#EDEBE6; --on-inv:#0E0E0F; --bad:#FF8B78; --warn:#F0B44C; --ok:#9BD67A;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r1:6px; --r2:12px; --r3:20px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
:root.th-light{
  --bg:#F5F5F2; --panel:#FFFFFF; --panel2:#ECEBE6; --panel3:#E2E0D9; --line:#DAD8D1; --line2:#BDBBB3;
  --ink:#0E0E0F; --ink2:#45454A; --ink3:#6B6B72;
  --live:#7A9A00; --on-live:#0E0E0F; --accent-text:#5A7000;
  --inv:#0E0E0F; --on-inv:#F5F5F2; --bad:#B3321F; --warn:#8A5A00; --ok:#2F6B1E;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
kbd{font:500 10.5px var(--f-mono);padding:1px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--ink2);background:var(--panel)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1560px;margin:0 auto;align-items:start}
/* рейка */
.rail{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 40px);overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--inv);position:relative;flex:none;overflow:hidden}
.logo::before{content:"";position:absolute;left:7px;top:7px;width:20px;height:20px;border:2px solid var(--on-inv);border-radius:50%;border-right-color:transparent;transform:rotate(-35deg)}
.logo::after{content:"";position:absolute;right:6px;bottom:6px;width:7px;height:7px;border-radius:50%;background:var(--live)}
.brand b{display:block;font:700 18px/1.05 var(--f-display);letter-spacing:-.015em}
.brand span{font:400 10.5px var(--f-mono);color:var(--ink3);letter-spacing:.05em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r1);cursor:pointer;color:var(--ink2);font-weight:500;position:relative;transition:background .15s,color .15s}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--live);outline-offset:-2px}
.nav button i{font:400 11px var(--f-mono);font-style:normal;color:var(--ink3);width:18px}
.nav button[aria-current="page"]{background:var(--panel2);color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--live)}
.nav button[aria-current="page"] i{color:var(--accent-text)}
.nav .badge{margin-left:auto;font:500 11px var(--f-mono);background:var(--inv);color:var(--on-inv);padding:1px 7px;border-radius:99px}
.nav .badge.warn{background:var(--warn);color:#0E0E0F}
.nav .sep{height:1px;background:var(--line);margin:6px 8px}
.railfoot{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.status{display:flex;gap:8px;align-items:center;font:400 11.5px var(--f-mono);color:var(--ink2);padding:8px 10px;border:1px solid var(--line);border-radius:var(--r1)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.dot.live{background:var(--live)}
.dot.bad{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.dot.live{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
.railfoot .row2{display:flex;gap:6px}
/* сцена */
.stage{position:relative;border:1px solid var(--line);border-radius:var(--r3);min-width:0;padding:26px 28px 34px;overflow:hidden;background:var(--bg)}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.28;-webkit-mask-image:linear-gradient(180deg,#000,transparent 340px);mask-image:linear-gradient(180deg,#000,transparent 340px);pointer-events:none}
.stage>*{position:relative}
.stage .x{position:absolute;font:400 13px/1 var(--f-mono);color:var(--line2);user-select:none}
.x1{top:8px;left:10px}.x2{top:8px;right:10px}.x3{bottom:8px;left:10px}.x4{bottom:8px;right:10px}
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.top .idx{font:400 12px var(--f-mono);color:var(--ink3);margin-bottom:8px;letter-spacing:.08em}
.top h1{font:700 28px/1.1 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.top .sub{color:var(--ink2);margin:8px 0 0;max-width:62ch}
.top .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:center;font:500 11px var(--f-mono);letter-spacing:.03em;padding:5px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;background:transparent}
.pill.inv{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.pill.live{border-color:var(--live);color:var(--accent-text)}
button.pill:hover{background:var(--panel2)}
.view{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.view,.stg>*{animation:none!important}}
.stg>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
/* кнопки и поля */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:var(--r1);border:1px solid var(--line2);background:transparent;font-weight:500;white-space:nowrap;transition:background .15s,transform .1s,opacity .15s}
.btn:hover{background:var(--panel2)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.btn.main:hover{opacity:.88;background:var(--inv)}
.btn.live{background:var(--live);color:var(--on-live);border-color:var(--live)}
.btn.live:hover{background:var(--live);opacity:.9}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.warn:hover{background:var(--bad);color:#0E0E0F}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:active{transform:none}
.field{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r1);padding:9px 12px;min-width:0}
.field:focus{outline:2px solid var(--live);outline-offset:1px}
select.field{padding-right:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;transition:background .15s}
.chip:hover{background:var(--panel2)}
.chip b{font:500 11px var(--f-mono);color:var(--ink3);font-weight:500}
.chip[aria-pressed="true"]{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--live)}
.sw input:checked+i::after{transform:translateX(18px);background:var(--on-live)}
.sw input:focus-visible+i{outline:2px solid var(--live);outline-offset:2px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer;margin:0;flex:none}
input[type=range]{width:100%;accent-color:var(--live)}
input[type=radio]{accent-color:var(--ink)}
/* панели */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;min-width:0}
.card.flat{background:transparent}
.h2{font:700 11px var(--f-mono);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin:0 0 12px}
.big{font:700 34px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font:500 14px var(--f-mono);color:var(--ink3);margin-left:6px;letter-spacing:0}
.note{font-size:12.5px;color:var(--ink3);line-height:1.55}
.note.box{border:1px solid var(--line2);border-radius:var(--r1);padding:10px 12px;color:var(--ink2)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:var(--c,minmax(0,1fr) minmax(300px,360px));gap:16px;align-items:start}
.sticky{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--line2);border-radius:var(--r1);color:var(--ink2);font-size:13px;margin-bottom:14px}
.hint b{font:700 10px var(--f-mono);letter-spacing:.1em;color:var(--accent-text);padding-top:3px}
.hint button{all:unset;margin-left:auto;cursor:pointer;color:var(--ink3);padding:0 4px}
.hint button:hover{color:var(--ink)}
/* уровни: цвет и значок, без букв */
.gl{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;vertical-align:-2px;flex:none}
.lv0{color:var(--ink)}.lv0 .gl,.gl.lv0{background:currentColor}
.lv1{color:var(--ink)}.lv1 .gl,.gl.lv1{background:radial-gradient(currentColor 0 34%,transparent 38%)}
.lv2{color:var(--ink3)}
.lv3{color:var(--warn)}.lv3 .gl,.gl.lv3{border-style:dashed}
.lv4{color:var(--bad)}.lv4 .gl,.gl.lv4{border-radius:2px;background:linear-gradient(45deg,transparent 42%,currentColor 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,currentColor 42% 58%,transparent 58%)}
.lvb{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);white-space:nowrap}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* таблица инвентаря */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);max-height:640px}
table{border-collapse:collapse;width:100%;min-width:760px}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--live)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
tbody tr.sel td{background:var(--panel2)}
tbody tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--live)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.mono-av{width:30px;height:30px;border-radius:8px;background:var(--panel3);display:grid;place-items:center;font:700 13px var(--f-display);color:var(--ink2);flex:none;border:1px solid var(--line)}
.who .nm{font-weight:500;line-height:1.25}
.who .pb{font-size:12px;color:var(--ink3);line-height:1.25}
.src{font:500 11px var(--f-mono);padding:2px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2);letter-spacing:.03em}
.szbar{display:flex;gap:8px;align-items:center;min-width:140px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .5s var(--ease)}
.meter.live i{background:var(--live)}
.meter.thick{height:10px}
.szbar span{font:400 12px var(--f-mono);min-width:7ch;text-align:right}
.flag{font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line);margin-right:4px;white-space:nowrap}
.flag.lock{border-color:var(--bad);color:var(--bad);background:transparent}
td .go{opacity:0;transition:opacity .12s}
tbody tr:hover .go,tbody tr.cur .go{opacity:1}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px 10px;font-size:13px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;word-break:break-word}
.code{font:400 12px/1.55 var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:9px 11px;word-break:break-all;color:var(--ink2)}
.code em{font-style:normal;color:var(--accent-text)}
/* график */
.donut{position:relative;flex:none}
.donut svg{display:block;transform:rotate(-90deg)}
.donut .dc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.dn{fill:none;transition:stroke-dasharray .6s var(--ease)}
.dn0{stroke:var(--ink)}.dn1{stroke:var(--ink2)}.dn2{stroke:var(--ink3)}.dn3{stroke:var(--warn)}.dn4{stroke:var(--bad)}.dn5{stroke:var(--line2)}.dnL{stroke:var(--live)}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;gap:2px;background:var(--line)}
.bar i{display:block;height:100%;min-width:3px;transition:flex .5s var(--ease)}
.bar i.s0{background:var(--ink)}.bar i.s1{background:var(--ink2)}.bar i.s2{background:var(--ink3)}.bar i.s3{background:var(--line2)}.bar i.s4{background:var(--accent-text);opacity:.75}.bar i.s5{background:var(--panel3)}
.ruler{position:relative;height:22px;border-top:1px solid var(--line2);margin-top:6px}
.ruler span{position:absolute;top:4px;font:400 10px var(--f-mono);color:var(--ink3);transform:translateX(-50%);white-space:nowrap}
.ruler span:first-child{transform:none}.ruler span:last-child{transform:translateX(-100%)}
.ruler span::before{content:"";position:absolute;top:-5px;left:50%;height:5px;border-left:1px solid var(--line2)}
.ruler span:first-child::before{left:0}.ruler span:last-child::before{left:100%}
.lrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:var(--r1);font-size:13px;cursor:pointer;border:1px solid transparent;background:transparent;width:100%;text-align:left}
.lrow:hover{background:var(--panel2)}
.lrow[aria-pressed="true"]{border-color:var(--line2);background:var(--panel2)}
.lrow .n{font:500 12px var(--f-mono);color:var(--ink2)}
.lrow .s{font:400 12px var(--f-mono);color:var(--ink3);min-width:7ch;text-align:right}
/* карта остатков */
.tmap{position:relative;height:190px;border-radius:var(--r1);overflow:hidden;background:var(--panel2)}
.tc{position:absolute;border:2px solid var(--panel);background:var(--panel3);padding:5px 7px;overflow:hidden;font-size:10.5px;color:var(--ink2);cursor:pointer;transition:background .15s,transform .15s;line-height:1.25;text-align:left;font-family:var(--f-mono)}
.tc:hover{z-index:2;outline:2px solid var(--live);outline-offset:-2px}
.tc.sel{background:var(--ink);color:var(--bg)}
.tc.t3{background:repeating-linear-gradient(135deg,var(--panel3),var(--panel3) 5px,var(--panel2) 5px,var(--panel2) 8px)}
.tc.t3.sel{background:var(--warn);color:#0E0E0F}
.tc.t4{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 4px,var(--line) 4px,var(--line) 5px);color:var(--bad);cursor:not-allowed}
.tc.t4.sel{background:var(--bad);color:#0E0E0F;cursor:pointer}
/* дерево остатков */
.tree{display:flex;flex-direction:column;gap:10px}
.cat{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);overflow:hidden}
.cat>summary{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::before{content:"+";font:500 15px var(--f-mono);color:var(--ink3);width:12px}
.cat[open]>summary::before{content:"\2212"}
.cat>summary .sum{margin-left:auto;font:400 12px var(--f-mono);color:var(--ink3)}
.item{display:grid;grid-template-columns:22px 18px minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px;align-items:center;border-top:1px dashed var(--line);transition:background .12s}
.item:hover{background:var(--panel2)}
.item .pt{font:400 12.5px/1.45 var(--f-mono);word-break:break-all}
.item .rs{font-size:12px;color:var(--ink3);grid-column:3/5}
.item .sz{font:400 12px var(--f-mono);color:var(--ink2);min-width:8ch;text-align:right}
.item.locked .pt{color:var(--ink3)}
.item .mini{height:3px;grid-column:3/5;background:var(--line);border-radius:2px;overflow:hidden}
.item .mini i{display:block;height:100%;background:var(--ink3)}
.dock{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5}
.dock .tt{display:flex;gap:22px;flex-wrap:wrap}
.dock .tt div{display:flex;flex-direction:column;line-height:1.2}
.dock .tt b{font:500 18px var(--f-mono)}
.dock .tt span{font-size:12px;color:var(--ink3)}
/* выполнение */
.pipe{display:flex;align-items:flex-start;margin:6px 0 22px;overflow-x:auto;padding-bottom:6px}
.pn{flex:1 0 96px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;text-align:center;font-size:12px;color:var(--ink3);padding:0 4px}
.pn i{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:500 12px var(--f-mono);font-style:normal;background:var(--bg);z-index:1;transition:all .3s var(--ease)}
.pn::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:2px;background:var(--line2)}
.pn:first-child::before{display:none}
.pn.done{color:var(--ink)}.pn.live{color:var(--ink)}
.pn.done i{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pn.done::before,.pn.live::before{background:var(--ink)}
.pn.live i{border-color:var(--live);color:var(--accent-text);box-shadow:0 0 0 5px color-mix(in srgb,var(--live) 18%,transparent)}
.pn.skip i{border-style:dashed}
.pn.cancel i{border-color:var(--bad);color:var(--bad)}
.shim{position:relative;overflow:hidden}
@media (prefers-reduced-motion:no-preference){.shim::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shim 1.3s linear infinite}}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.live-n{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.live-n div{border:1px solid var(--line);border-radius:var(--r1);padding:8px 10px}
.live-n b{display:block;font:500 20px var(--f-mono)}
.live-n span{font-size:12px;color:var(--ink3)}
.log{font:400 12px/1.7 var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:12px 14px;height:280px;overflow:auto;color:var(--ink2)}
.log .t{color:var(--ink3)}.log .ok{color:var(--ok)}.log .w{color:var(--warn)}.log .b{color:var(--bad)}
/* чек */
.ticket{position:relative;max-width:780px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:26px 30px 22px}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 8px 0,var(--bg) 6px,transparent 7px) 0 0/16px 10px repeat-x}
.ticket::before{top:-1px}
.ticket::after{bottom:-1px;transform:scaleY(-1)}
.stamp{display:inline-block;font:700 12px var(--f-display);letter-spacing:.08em;border:2px solid var(--live);color:var(--accent-text);padding:6px 12px;border-radius:6px;transform:rotate(-4deg)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .5s var(--ease) both .3s}}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.8)}}
.ticket table{min-width:0}
.ticket td,.ticket th{padding:8px 4px}
.passport{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:12px;border-top:1px dashed var(--line2);font:400 11px var(--f-mono);color:var(--ink3);letter-spacing:.04em}
.ba{display:grid;grid-template-columns:44px 1fr auto;gap:8px 10px;align-items:center;font-size:13px}
/* журнал */
.week{display:grid;grid-template-columns:repeat(28,1fr);gap:3px}
.week i{aspect-ratio:1;border-radius:3px;background:var(--line);display:block}
.week i.a{background:var(--ink3)}.week i.b{background:var(--ink)}
.week i.s{outline:2px solid var(--live)}
.grp{margin-bottom:14px}
.grp>.gh{display:flex;justify-content:space-between;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:0 4px 6px}
.op{all:unset;box-sizing:border-box;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);cursor:pointer;width:100%;margin-bottom:6px;transition:border-color .15s,background .15s}
.op:hover{background:var(--panel2)}
.op:focus-visible{outline:2px solid var(--live)}
.op[aria-current="true"]{border-color:var(--ink)}
.op .tl{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink3);justify-self:center}
.op[aria-current="true"] .tl{background:var(--live);border-color:var(--live)}
.op .nm{font-weight:600}.op .sm{font-size:12px;color:var(--ink3);grid-column:2}
.st{font:500 11px var(--f-mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line2);white-space:nowrap;color:var(--ink2)}
.st.ok{border-color:var(--ok);color:var(--ok)}
.st.part{border-color:var(--warn);color:var(--warn)}
.st.gone{border-style:dashed;color:var(--ink3)}
/* карантин */
.bucket{display:flex;flex-direction:column;gap:8px}
.bucket>.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bucket>.bh b{font:700 13px var(--f-display)}
.qop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.qop .b{font-weight:600}.qop .s{font-size:12px;color:var(--ink3)}
.qop .acts{grid-column:1/3;display:flex;gap:6px}
.ringsm{position:relative;width:48px;height:48px;flex:none}
.ringsm svg{transform:rotate(-90deg);display:block}
.ringsm span{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono)}
/* зоны */
.stairs{display:flex;flex-direction:column;gap:6px}
.step5{display:grid;grid-template-columns:34px minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);transition:transform .2s var(--ease),border-color .2s}

.step5 .gl{width:18px;height:18px}
.step5 b{font-weight:600}
.step5 .act{font:500 11px var(--f-mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.zone{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);cursor:default;transition:border-color .15s}

.zone .p{font:500 12.5px var(--f-mono);word-break:break-all}
.zone .r{font-size:12.5px;color:var(--ink2);margin-top:4px}
.zone .r em{font-style:normal;color:var(--bad);font-family:var(--f-mono);font-size:11px}
.verdict{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r1);border:1px solid var(--line2);margin-top:12px;animation:rise .25s var(--ease) both}
.verdict.bad{border-color:var(--bad)}
.verdict.ok{border-color:var(--ok)}
/* оптимизация */
.task{display:grid;grid-template-columns:44px minmax(0,1fr) 150px auto;gap:6px 14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);transition:border-color .15s,opacity .2s}
.task.off{opacity:.55}
.task.done{border-color:var(--ok)}
.task .nm{font-weight:600}.task .ds{font-size:12px;color:var(--ink3)}
.task .gn{font:500 13px var(--f-mono);text-align:right}
.kind{font:500 10.5px var(--f-mono);padding:2px 7px;border-radius:4px;background:var(--panel2);color:var(--ink2);margin-right:6px}
.risk{font:500 11px var(--f-mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2)}
.risk.r1{color:var(--warn);border-color:var(--warn)}.risk.r2{color:var(--bad);border-color:var(--bad)}
/* под наблюдением */
.rec-big{font:700 56px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.steps3 span.dn{color:var(--ink);background:var(--panel2)}
/* доверие */

.sc .n{font-weight:600}

/* настройки */

.set{display:grid;grid-template-columns:var(--c,minmax(0,1fr) minmax(180px,260px));gap:6px 20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}

.ctxmenu{width:240px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);padding:4px;box-shadow:0 10px 24px rgba(0,0,0,.3);font-size:13px}

/* старт */
.start{min-height:560px;display:grid;place-items:center;text-align:center}

.start p{margin:0;color:var(--ink2)}
.uac{width:100%;max-width:480px;text-align:left;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);overflow:hidden}

.uac .ub{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.srcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 20px;width:100%;max-width:520px;text-align:left}
.srcgrid div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink3);padding:6px 0;border-bottom:1px solid var(--line)}
.srcgrid div.on{color:var(--ink)}
.srcgrid div.dn{color:var(--ink)}
.srcgrid .n{margin-left:auto;font:500 12px var(--f-mono)}
/* палитра */
.pal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:start center;padding:12vh 16px 0;z-index:40}
.pal[hidden]{display:none}
.pal .box{width:100%;max-width:580px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:16px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.pal li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:var(--r1);cursor:pointer;color:var(--ink2)}
.pal li .k{margin-left:auto;font:400 11px var(--f-mono);color:var(--ink3)}
.pal li[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.pal .ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
dialog{border:1px solid var(--line2);border-radius:var(--r3);background:var(--panel);color:var(--ink);padding:24px 26px;max-width:500px;width:calc(100% - 32px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font:700 17px/1.2 var(--f-display);margin:0 0 12px}
dialog .row.end{margin-top:20px;justify-content:flex-end}
dialog label.o{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv);color:var(--on-inv);padding:10px 18px;border-radius:99px;font-weight:500;z-index:60;max-width:calc(100% - 32px);animation:rise .25s var(--ease) both}
.toast[hidden]{display:none}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font:700 16px var(--f-display);margin-bottom:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- система: обзор, режимы, питание ---- */
.ds{font-size:12px;color:var(--ink3)}
.dashtop{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.hero .row{align-items:center}
.prow{display:grid;grid-template-columns:128px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink2);margin-bottom:7px}
.prow b{text-align:right;font-weight:500}
.boot{display:flex;gap:28px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2);align-items:flex-end}

.mongrid,.mongrid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.spark2{height:56px;margin-top:6px}

.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);cursor:pointer;transition:border-color .15s,transform .15s var(--ease)}
.tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.tile b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.rec{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.rec>div:first-child{min-width:0}

.chg-mini{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}

.chd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);vertical-align:middle;margin-left:4px;flex:none}
.modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mode,.plan{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);cursor:pointer;min-height:136px;transition:border-color .15s,transform .2s var(--ease),background .15s}
.mode:hover,.plan:hover{transform:translateY(-3px);background:var(--panel2)}
.mode:focus-visible,.plan:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.mode.sel,.plan.sel{border-color:var(--ink);background:var(--panel2)}
.mode svg{color:var(--ink2);margin-bottom:4px}
.mode.act svg{color:var(--accent-text)}
.mode b,.plan b{font:700 14px/1.25 var(--f-display)}
.plan{min-height:92px}
.plan.add{border-style:dashed;background:transparent}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.oplist{display:flex;flex-direction:column;max-height:340px;overflow:auto}

.oplist .src{flex:none}
.pf{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,190px) 8px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}

.pf>.field{width:100%}
.pf .val{display:flex;gap:8px;align-items:center}
.pf output{font:500 12px var(--f-mono);min-width:7ch;text-align:right}
.est{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.est div{border:1px solid var(--line);border-radius:var(--r1);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.est b{font:700 20px/1.1 var(--f-display)}
.lg{display:inline-block;width:12px;height:10px;border-radius:3px;background:var(--ink)}
.lg.dash{width:16px;height:3px;background:repeating-linear-gradient(90deg,var(--ink3) 0 5px,transparent 5px 8px);border-radius:0}
.lg.imp2{background:var(--ink)}.lg.imp1{background:var(--ink2)}.lg.imp0{background:var(--ink3)}
.timeline{display:flex;gap:2px;height:24px}

.timeline .tl-i.imp2{background:var(--ink)}.timeline .tl-i.imp1{background:var(--ink2)}.timeline .tl-i.imp0{background:var(--ink3)}
.runst{display:inline-flex;gap:6px;align-items:center;font:500 12px var(--f-mono);white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;box-sizing:border-box;padding:10px 14px;cursor:pointer;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:color .15s}
.tabs button b{font:500 11px var(--f-mono);color:var(--ink3)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--live)}
.tabs button:focus-visible{outline:2px solid var(--live);outline-offset:-2px}
.twlist{display:flex;flex-direction:column;gap:8px}
.tw{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(170px,300px);gap:6px 14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.tw .nm,.task .nm{font-weight:600}
.tw .ds.mono{word-break:break-all;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tree2{display:flex;flex-direction:column;max-height:480px;overflow:auto}
.tn{all:unset;box-sizing:border-box;display:flex;gap:6px;align-items:center;padding:4px 8px 4px calc(8px + var(--d,0)*14px);border-radius:var(--r1);cursor:pointer;font:400 12.5px var(--f-mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.tn i{width:12px;font-style:normal;color:var(--ink3);flex:none}
.tn em{color:var(--warn);font-style:normal}
.tn:hover{background:var(--panel2)}
.tn.sel{background:var(--panel3);color:var(--ink)}
.tn:focus-visible{outline:2px solid var(--live);outline-offset:-2px}
.evlist{max-height:420px;overflow:auto;display:flex;flex-direction:column}

.ev .op{font-family:var(--f-mono);color:var(--ink3)}

.nogo .gl{margin-top:3px}
.steps5{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.steps5>div{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink2)}
.codewrap{display:flex;gap:10px;align-items:flex-start}
.codewrap .code{flex:1;min-width:0;margin:0;white-space:pre-wrap;max-height:220px;overflow:auto}
.codewrap .btn{flex:none}
/* ---- эффекты ---- */
.fxstage{position:relative;aspect-ratio:16/10;border-radius:var(--r2);overflow:hidden;background:linear-gradient(135deg,#2b3a2f,#1b2230 60%,#33263a);border:1px solid var(--line2)}
.fxicons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:10px}
.fxicons span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000;width:54px}
.fxstage.nosh .fxicons span{text-shadow:none}
.fxicons i{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.75)}
.fxwin{position:absolute;left:24%;top:12%;width:62%;height:62%;border-radius:10px;background:rgba(40,40,46,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 34px rgba(0,0,0,.45);transition:transform var(--md,380ms) var(--ease),opacity var(--md,380ms) var(--ease);transform-origin:50% 100%;color:#fff}

/* ---------- 03 выполнение ---------- */
const STEPS=[
  ["Точка восстановления","Checkpoint-Computer и проверка перечислением",1.2,"Создаём точку и сверяем её в списке: код S_OK на веру не принимаем."],
  ["Снимок","USN-журнал и экспорт затронутых ключей",1.4,"Запоминаем состояние тома и веток реестра, чтобы потом найти разницу."],
  ["Закрытие процессов","Restart Manager, без принудительной остановки",1.1,"Просим программы закрыться штатно. TerminateProcess не используется."],
  ["Деинсталлятор","запуск штатного удаления",2.0,"Запускаем родной деинсталлятор программы. С этого момента отменить операцию нельзя, но карантин всё вернёт."],
  ["Дифф","что появилось и что осталось",1.3,"Сравниваем с снимком и находим остатки, которых не назвал установщик."],
  ["Карантин","перемещение на том, манифест, SHA-256",1.7,"Переносим объекты, пишем манифест с хешами, права и владельцев."],
  ["Проверка","sfc /verifyonly, DISM /CheckHealth",1.2,"Проверяем целостность системы после удаления."]
];
function startRun(sel,restore){
  const progs=S.prev.ids.map(prog);
  S.run={items:sel,dry:S.prev.dry,progs,restore:!!restore,step:-1,t0:Date.now(),done:false,cancelled:false,log:[],states:STEPS.map(()=>"wait"),tm:[],iv:null,files:0,keys:0,mb:0,id:null};
  go("run");
  S.run.iv=setInterval(()=>{const e=$("#elap");if(e&&S.run)e.textContent=elapsed()},500);
  tick();
}
const elapsed=()=>{const s=Math.floor((Date.now()-S.run.t0)/1000);return pad(Math.floor(s/60))+":"+pad(s%60)};
function logL(cls,msg){const d=new Date();S.run.log.push('<span class="t">'+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+'</span> <span class="'+cls+'">'+esc(msg)+'</span>');const l=$("#log");if(l){l.innerHTML=S.run.log.join("<br>");l.scrollTop=l.scrollHeight}}
function tick(){
  const R=S.run;if(!R||R.cancelled)return;
  R.step++;if(R.step>0)R.states[R.step-1]="done";
  if(R.step>=STEPS.length){finishRun();return}
  const n=R.items.length,name=STEPS[R.step][0];
  const skip=(R.dry&&R.step>=3&&R.step<=5)||(R.step===0&&!R.restore&&!R.dry);
  if(skip){R.states[R.step]="skip";logL("w",name+": "+(R.step===0?"пропущено по вашему выбору":"пропущено в сухом прогоне"));if(S.view==="run")vRun();R.tm.push(setTimeout(tick,reduced()?40:260));return}
  R.states[R.step]="live";
  const m=[
    ["Создаю точку восстановления «Чистовик»","Точка найдена в перечислении"],
    ["Читаю USN-журнал тома C:","Экспортировано ключей реестра: "+R.items.filter(i=>i.cat==="Реестр").length],
    ["Ищу процессы, держащие файлы программы","Закрытие запрошено штатно, принудительных остановок нет"],
    ["Запускаю: "+R.progs.map(p=>methodOf(p).split(",")[0]).join("; "),"Код возврата 0"],
    ["Сверяю файлы и реестр со снимком","Новых кандидатов: "+Math.max(0,Math.floor(n*.08))],
    ["Перемещаю "+n+" объектов в C:"+B+"ProgramData"+B+"Chistovik"+B+"quarantine","Хеши записаны в манифест"],
    ["Запускаю sfc /verifyonly","Нарушений целостности не найдено"]
  ][R.step];
  logL("",m[0]);
  const dur=STEPS[R.step][2]*(reduced()?.05:1)*1000;
  R.tm.push(setTimeout(()=>{if(S.run===R&&!R.cancelled){logL("ok",m[1]);
    if(R.step===1)R.keys=R.items.filter(i=>i.cat==="Реестр").length;
    if(R.step===5){R.files=R.items.filter(i=>i.cat!=="Реестр").length;R.mb=sum(R.items,i=>i.mb)}
    if(S.view==="run")vRun()}},dur*.65));
  R.tm.push(setTimeout(tick,dur));
  if(S.view==="run")vRun();
}
function cancelRun(){
  const R=S.run;if(!R||R.done||R.step>=3)return;
  R.cancelled=true;R.done=true;R.tm.forEach(clearTimeout);clearInterval(R.iv);
  R.states=R.states.map((s,i)=>s==="live"?"cancel":s);
  logL("w","Операция отменена до запуска деинсталлятора. Система не изменена.");
  vRun();go("run",{keepScroll:1});toast("Отменено. Ничего не изменено");
}
function vRun(){
  const el=$("#view"),R=S.run;
  if(!R){el.innerHTML='<div class="card empty"><b>Операций сейчас нет</b>Запуск начинается из предпросмотра остатков.<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" type="button" data-act="goto" data-v="prev">К предпросмотру</button><button class="btn main" type="button" data-act="goto" data-v="rec">Открыть чек</button></div></div>';return}
  const cur=R.states.indexOf("live"),curStep=cur>=0?STEPS[cur]:null,canC=!R.done&&R.step<3;
  const pct=Math.round(R.states.filter(s=>s==="done"||s==="skip").length/STEPS.length*100);
  const keep=$("#log")?$("#log").scrollTop:0;
  el.innerHTML='<div class="pipe">'+STEPS.map((s,i)=>'<div class="pn '+R.states[i]+'"><i>'+(R.states[i]==="done"?"✓":R.states[i]==="skip"?"–":R.states[i]==="cancel"?"×":i+1)+'</i><span>'+s[0]+'</span></div>').join("")+'</div>'+
  '<div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(300px,380px)"><div class="card"><div class="row sb" style="margin-bottom:10px"><p class="h2" style="margin:0">Журнал выполнения</p><span class="mono note" id="elap">'+elapsed()+'</span></div><div class="log" id="log" tabindex="0" aria-label="Журнал выполнения">'+R.log.join("<br>")+'</div></div>'+
  '<aside class="card"><p class="h2">'+(R.cancelled?"Отменено":R.done?"Готово":R.dry?"Сейчас · сухой прогон":"Сейчас")+'</p>'+

function cmdFor(k,i,v){

    if(v==="d30"||v==="d120")L.push('schtasks /create /tn "Chistovik'+B+'Delay-'+i.id+'" /tr "<путь запуска '+i.name+'>" /sc onlogon /delay '+(v==="d30"?"0000:30":"0002:00")+' /f');

function sparkSvg(a,max,w,h){
  const n=a.length,st=w/59,pts=a.map((v,i)=>[(i+(60-n))*st,h-3-(Math.min(v,max)/max)*(h-8)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path class="sa" d="'+d+"L"+w+" "+h+"L"+pts[0][0].toFixed(1)+" "+h+'Z"/><path class="sl2" d="'+d+'"/></svg>';
}
const lastOf=a=>a[a.length-1]||0;
function startMon(){if(MON.timer)return;MON.timer=setInterval(monTick,reduced()?1500:1000)}
function monTick(){
  walk(MON.cpu,4,78,9);walk(MON.ram,48,66,1.1);walk(MON.dsk,0,40,12);walk(MON.net,0,45,14);
  MON.cores=MON.cores.map(c=>Math.max(2,Math.min(95,c+(Math.random()-.5)*22)));

const ST_W={now:1,d30:.35,d120:.15,off:0};
const bootSec=useWant=>11.5+sum(S.st,i=>i.sec*ST_W[useWant?i.want:i.cur]);
function health(){
  const st=S.st.filter(i=>i.cur==="now"),pS=Math.min(30,sum(st,i=>i.imp===2?5:i.imp===1?2:0));
  const pV=Math.min(15,S.sv.filter(i=>i.rec&&i.risk===0&&i.cur!==i.rec).length*2.5);
  const pT=Math.min(15,S.tw.filter(t=>t.rec&&!t.dubious&&!t.cur).length*1.5);
  const pK=Math.min(8,S.tk.filter(t=>t.rec&&t.cur).length*2);
  const q=qUsedMB()>S.warn*1024?6:0;
  const parts=[["Запуск",100-pS/30*100],["Службы и задачи",100-(pV+pK)/23*100],["Настройки",100-pT/15*100],["Карантин",q?40:100]];
  const score=Math.round(Math.max(35,100-pS-pV-pT-pK-q));
  return {score,parts};
}

function modeOps(m){
  const ops=[];
  if(m.pw&&S.pw.active!==m.pw)ops.push({k:"pw",id:m.pw});
  Object.entries(m.tw||{}).forEach(([id,v])=>{const it=S.tw.find(x=>x.id===id);if(it&&it.cur!==v)ops.push({k:it.fx?"fx":"tw",it,v})});
  Object.entries(m.st||{}).forEach(([id,v])=>{const it=S.st.find(x=>x.id===id);if(it&&it.cur!==v)ops.push({k:"st",it,v})});
  Object.entries(m.sv||{}).forEach(([id,v])=>{const it=S.sv.find(x=>x.id===id);if(it&&it.cur!==v&&it.risk<2)ops.push({k:"sv",it,v})});
  Object.entries(m.tk||{}).forEach(([id,v])=>{const it=S.tk.find(x=>x.id===id);if(it&&it.cur!==v)ops.push({k:"tk",it,v})});
  return ops;
}

function zoneRect(m,z,g){
  const sp=(o,len,a,b)=>[o+g+a*(len-2*g)+(a>0?g/2:0),o+g+b*(len-2*g)-(b<1?g/2:0)];

}
function monAt(cx,cy){
  let best=null;
  MONS.forEach(m=>{const dx=Math.max(m.x-cx,0,cx-(m.x+m.w)),dy=Math.max(m.y-cy,0,cy-(m.y+m.h)),d=Math.hypot(dx,dy);if(!best||d<best.d)best={m,d}});
  return best.m;

function winMove(e){
  const d=S.win.drag;if(!d)return;
  const cv=$("#wcanvas");if(!cv){S.win.drag=null;return}
  const k=DESK.w/(cv.getBoundingClientRect().width||800),dx=(e.clientX-d.sx)*k,dy=(e.clientY-d.sy)*k;
  if(!d.moved&&Math.abs(dx)+Math.abs(dy)<60)return;
  d.moved=true;
  const w=S.win.list.find(x=>x.id===d.id);
  w.x=Math.round(Math.max(0,Math.min(DESK.w-200,d.ox+dx)));w.y=Math.round(Math.max(0,Math.min(DESK.h-100,d.oy+dy)));
  const n=cv.querySelector('[data-win="'+d.id+'"]');
  if(n){n.style.left=(w.x/DESK.w*100)+"%";n.style.top=(w.y/DESK.h*100)+"%";n.classList.add("drag")}
  const gh=$("#wghost");
  if(gh){if(S.win.snap){const b=bestZone(w,S.win.gap);gh.hidden=false;gh.style.cssText=wpos(b.r)}else gh.hidden=true}
}
function winUp(){
  const d=S.win.drag;S.win.drag=null;if(!d)return;
  const w=S.win.list.find(x=>x.id===d.id);if(!w)return;
  S.win.sel=d.id;
  if(!d.moved){if(S.view==="win")vWin();return}
  if(S.win.snap)setRect(w,bestZone(w,S.win.gap).r);
  const cv=$("#wcanvas"),n=cv&&cv.querySelector('[data-win="'+d.id+'"]');
  if(n){n.classList.remove("drag");n.style.cssText=wpos(w)}
  const gh=$("#wghost");if(gh)gh.hidden=true;
  S.win.skipClick=true;
  setTimeout(()=>{S.win.skipClick=false;if(S.view==="win"&&!S.win.drag)vWin()},S.win.anim&&!reduced()?260:0);
}
$("#view").addEventListener("pointerdown",e=>{
  const n=e.target.closest(".wnd");if(!n||S.view!=="win")return;
  const w=S.win.list.find(x=>x.id===n.dataset.win);if(!w)return;
  e.preventDefault();S.win.drag={id:w.id,sx:e.clientX,sy:e.clientY,ox:w.x,oy:w.y,moved:false};
  try{n.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener("pointermove",winMove);
document.addEventListener("pointerup",winUp);
document.addEventListener("pointercancel",()=>{S.win.drag=null});

  dens:b=>{S.compact=b.dataset.v==="compact";applyLook();persist();vSet()},
  calm:b=>{S.calm=b.checked;applyLook();persist();vSet()},
  bakCopy:()=>copyTxt(JSON.stringify(prefs(),null,2),"Настройки скопированы"),
  resetAll:()=>{const n=S.chg.filter(c=>!c.undone&&c.undo).length;dialog("Сбросить все изменения системы",'<p style="margin:0">Будет отменено записей: '+n+'.</p>',"Сбросить",()=>{undoAll();vSet()})}
};
function regTreeNode(p){let n=regTree();p.split(B).forEach(s=>{n=(n&&n.ch[s])||{ch:{}}});return n}
const CHG={
  svsel:t=>{const i=S.sv.find(x=>x.id===t.dataset.id);if(i&&i.risk<2){i.want=t.value;refresh()}},
  tksw:t=>{const i=S.tk.find(x=>x.id===t.dataset.id);if(i){i.want=t.checked;refresh()}},
  twsw:t=>{const i=S.tw.find(x=>x.id===t.dataset.id);if(i){i.want=t.checked;refresh()}},
  stsel:t=>{const i=S.st.find(x=>x.id===t.dataset.id);if(i){i.want=t.value;refresh()}},
  pwsel:t=>{const p=S.pw.plans.find(x=>x.id===S.pw.sel);p.want[t.dataset.s][t.dataset.f]=+t.value;refresh()},
  prio:t=>setPrio(t.dataset.pid,t.value),
  winsnap:t=>{S.win.snap=t.checked;vWin()},
  winanim:t=>{S.win.anim=t.checked;vWin()},
  winrem:t=>{S.win.remember=t.checked;vWin()}
};
const INP={
  svq:t=>{S.svc.q=t.value;typeRender(t,vSv)},
  stq:t=>{S.stf.q=t.value;typeRender(t,vSt)},
  regq:t=>{S.reg.q=t.value;typeRender(t,vReg)},
  regbq:t=>{S.reg.bq=t.value;typeRender(t,vReg)},
  regflt:t=>{S.reg.w.flt=t.value;regWatchPaint()},
  monq:t=>{MON.q=t.value;typeRender(t,vMon)},
  pw:t=>{
    const p=S.pw.plans.find(x=>x.id===S.pw.sel),f=PF.find(x=>x.f===t.dataset.f),v=+t.value;
    p.want[t.dataset.s][t.dataset.f]=v;
    const o=document.getElementById("o-"+t.dataset.s+"-"+t.dataset.f);if(o)o.textContent=f.never&&v===0?"Никогда":v+" "+f.u;
    pwLive();
  },
  fxdelay:t=>{S.tw.find(x=>x.id==="delay").want=+t.value;const o=$("#fxdO");if(o)o.textContent=t.value+" мс";const s=$("#fxstage");if(s)s.style.setProperty("--dl",t.value+"ms")},
  wingap:t=>{S.win.gap=+t.value;const o=$("#wgapO");if(o)o.textContent=t.value+" px"}
};
const VF={start:vStart,inv:vInv,prev:vPrev,run:vRun,rec:vRec,jrn:vJrn,qrn:vQrn,zon:vZon,opt:vOpt,wat:vWat,bnc:vBnc,set:vSet,dash:vDash,modes:vModes,pw:vPw,st:vSt,sv:vSv,reg:vReg,fx:vFx,win:vWin,mon:vMon,chg:vChg};
/* внешний вид */
const prefs=()=>({theme:S.theme,restore:S.restore,ret:S.ret,warn:S.warn,jd:S.jd,ctx:S.ctx,compact:!!S.compact,calm:!!S.calm});
function applyLook(){const h=document.documentElement;h.classList.toggle("compact",!!S.compact);h.classList.toggle("calm",!!S.calm);CALM=!!S.calm}
/* ---------- палитра ---------- */
let palSel=0,palItems=[];
function palBuild(){
  const q=$("#palQ").value.trim().toLowerCase();
  const act=[
    ...visibleViews().map(v=>({t:"Перейти: "+v.t,k:"экран",run:()=>go(v.id)})),
    ...MODES.map(m=>({t:"Включить режим: "+m.n,k:"режим",run:()=>{go("modes");S.modeSel=m.id;vModes();applyMode(m.id)}})),
    {t:"Отменить все изменения системы",k:"команда",run:()=>ACT.chgAll()},
    {t:"Сканировать заново",k:"команда",run:()=>{go("inv");$("#view").scrollIntoView();rescan()}},
    {t:S.theme==="dark"?"Включить светлую тему":"Включить тёмную тему",k:"команда",run:()=>setTheme(S.theme==="dark"?"light":"dark")},
    {t:S.expert?"Выключить экспертный режим":"Включить экспертный режим",k:"команда",run:expertToggle}
  ];
  const pr=S.started?S.programs.filter(p=>q&&(p.name+" "+p.pub).toLowerCase().includes(q)).slice(0,6).map(p=>({t:p.name,k:"программа · "+fmt(p.size),run:()=>{S.cur=p.id;S.picked[p.id]=true;go("inv");const r=$('tr[data-id="'+p.id+'"]');if(r)r.scrollIntoView({block:"center"})}})):[];
  palItems=pr.concat(act.filter(a=>!q||a.t.toLowerCase().includes(q))).slice(0,10);
  palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $("#palL").innerHTML=palItems.map((a,i)=>'<li role="option" data-i="'+i+'" aria-selected="'+(i===palSel)+'">'+esc(a.t)+'<span class="k">'+esc(a.k)+'</span></li>').join("")||'<li>Ничего не найдено</li>';
}
function palOpen(){if(!S.started){toast("Сначала просканируйте систему");return}const p=$("#pal");p.hidden=false;$("#palQ").value="";palSel=0;palBuild();$("#palQ").focus()}
function palClose(){$("#pal").hidden=true}
$("#palQ").addEventListener("input",()=>{palSel=0;palBuild()});
$("#palQ").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palBuild()}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);palBuild()}
  else if(e.key==="Enter"){e.preventDefault();const a=palItems[palSel];palClose();if(a)a.run()}
  else if(e.key==="Escape")palClose();
});
$("#palL").addEventListener("click",e=>{const li=e.target.closest("li[data-i]");if(!li)return;const a=palItems[+li.dataset.i];palClose();if(a)a.run()});
$("#pal").addEventListener("mousedown",e=>{if(e.target.id==="pal")palClose()});
$("#palBtn").addEventListener("click",palOpen);

/* ---------- общие действия ---------- */
function setTheme(t){S.theme=t;document.documentElement.classList.toggle("th-light",t==="light");persist();if(S.view==="set")vSet()}
$("#thBtn").addEventListener("click",()=>setTheme(S.theme==="dark"?"light":"dark"));
function rescan(){
  if(S.scanning)return;S.scanning=true;S.scanIdx=0;
  const t=setInterval(()=>{S.scanIdx++;if(S.scanIdx>=COVER.length){clearInterval(t);S.scanning=false;toast("Прочитано источников: "+COVER.length)}},reduced()?40:300);
  toast("Читаю реестр и список пакетов…");
}
let dlgCb=null,dlgIv=null;
function dialog(t,html,yes,cb,wait){
  $("#dlgT").textContent=t;$("#dlgB").innerHTML=html;const y=$("#dlgYes");y.textContent=yes||"Подтвердить";dlgCb=cb;clearInterval(dlgIv);
  if(wait){let n=reduced()?1:wait;y.disabled=true;y.textContent=(yes||"Подтвердить")+" ("+n+")";dlgIv=setInterval(()=>{n--;if(n<=0){clearInterval(dlgIv);y.disabled=false;y.textContent=yes||"Подтвердить"}else y.textContent=(yes||"Подтвердить")+" ("+n+")"},1000)}else y.disabled=false;
  const d=$("#dlg");if(d.showModal)d.showModal();else d.setAttribute("open","");
}
$("#dlgNo").onclick=()=>{clearInterval(dlgIv);$("#dlg").close();dlgCb=null};
$("#dlgYes").onclick=()=>{const cb=dlgCb;dlgCb=null;clearInterval(dlgIv);$("#dlg").close();if(cb)cb()};
$("#dlg").addEventListener("close",()=>{clearInterval(dlgIv)});
let tt=null;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},3400)}

/* ---------- события ---------- */
const ACT={
  adm:b=>{S.admin=b.dataset.v==="1";buildNav();vStart()},
  scanStart:()=>scanStart(),
  hintoff:b=>{S.hintsOff[b.dataset.id]=1;persist();const h=b.closest(".hint");if(h)h.remove()},
  srcf:b=>{S.srcF=S.srcF===b.dataset.v?"":b.dataset.v;vInv()},
  sel:b=>{S.cur=b.dataset.id;vInv()},
  open:b=>{S.picked[b.dataset.id]=true;S.cur=b.dataset.id;openPrev()},
  analyze:()=>openPrev(),
  sort:b=>{const k=b.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==="size"||k==="date"?-1:1};vInv()},
  rescan:()=>{rescan();setTimeout(()=>{if(S.view==="inv")vInv()},reduced()?60:COVER.length*300+100)},
  sample:()=>{S.programs=sample();S.real=false;S.cur="s1";S.picked={};vInv();toast("Вернул пример")},
  goto:b=>go(b.dataset.v),
  ptab:b=>{S.prev.pi=+b.dataset.i;vPrev()},
  lf:b=>{S.prev.lvlF=b.dataset.v;vPrev()},
  tick:b=>{const i=leftovers(curProg()).find(x=>x.id===b.dataset.id);if(!i)return;if(!canTick(i)){toast(i.hard?"Системный компонент: закрыт всегда":"Защищено. Включите экспертный режим в разделе «Защита»");return}S.prev.sel[i.id]=!S.prev.sel[i.id];vPrev()},
  cat:b=>{leftovers(curProg()).filter(i=>i.cat===b.dataset.c&&canTick(i)).forEach(i=>S.prev.sel[i.id]=b.checked);vPrev()},
  selSafe:()=>{leftovers(curProg()).forEach(i=>S.prev.sel[i.id]=i.level<=2&&!i.locked);vPrev()},
  selL3:()=>{leftovers(curProg()).forEach(i=>{if(i.level===3)S.prev.sel[i.id]=true});vPrev()},
  goRun:()=>confirmRun(),
  cancel:()=>cancelRun(),
  cpRec:()=>{const r=S.receipts[0]||S.journal[0];const txt=r.id+"\nSHA-256 "+r.hash+"\n"+r.items.map(i=>"L"+i.level+"\t"+i.path+"\t"+i.mb).join("\n");try{navigator.clipboard.writeText(txt).then(()=>toast("Манифест скопирован"),()=>toast("Буфер обмена недоступен в этом окне"))}catch(e){toast("Буфер обмена недоступен в этом окне")}},
  toJ:b=>{S.jsel=b.dataset.id;go("jrn")},
  jsel:b=>{S.jsel=b.dataset.id;vJrn()},
  rollback:b=>rollbackDlg(b.dataset.id),
  purge:b=>{const r=S.journal.find(x=>x.id===b.dataset.id);if(!r)return;const q=r.items.filter(i=>i.state==="quarantined");dialog("Очистить навсегда","<p style='margin:0 0 8px'>"+q.length+" объектов программы "+esc(r.progs[0].name)+" будут удалены без возврата.</p><p class='note' style='margin:0'>Это единственное необратимое действие в программе.</p>","Очистить",()=>{q.forEach(i=>i.state="purged");buildNav();vQrn();toast("Очищено: "+q.length+" объектов")})},
  goset:()=>{S.setSec="qrn";go("set")},
  expert:()=>expertToggle(),
  optTog:b=>{const o=S.opt.find(x=>x.id===b.dataset.id);if(o){o.on=b.checked;vOpt()}},
  optApply:()=>optApply(),
  optUndo:b=>{const o=S.opt.find(x=>x.id===b.dataset.id);if(o){o.applied=false;o.on=false;vOpt();toast("Возвращено: "+o.name)}},
  watStart:()=>watStart(),
  watDone:()=>{watStop();S.wat.phase=2;vWat()},
  watCancel:()=>{watStop();S.wat.phase=0;vWat()},
  watAgain:()=>{S.wat.phase=0;vWat()},
  theme:b=>setTheme(b.dataset.v),
  ctx:b=>{S.ctx=b.checked;persist();vSet()},
  setsec:b=>{S.setSec=b.dataset.v;vSet()}
};
Object.assign(ACT,ACT2);
$("#view").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(b&&!(b.tagName==="INPUT"&&b.type==="checkbox")){if(ACT[b.dataset.act]){if(b.tagName==="BUTTON"&&b.closest("tr")&&b.dataset.act==="open")e.stopPropagation();ACT[b.dataset.act](b)}return}
  if(S.view==="inv"){
    const cb=e.target.closest("[data-pick]");
    if(cb){S.picked[cb.dataset.pick]=cb.checked;const y=window.scrollY,tw=$("#tw"),st=tw?tw.scrollTop:0;vInv();window.scrollTo({top:y});const t2=$("#tw");if(t2)t2.scrollTop=st;return}
    const tr=e.target.closest("tr[data-id]");if(tr&&!e.target.closest("input")){S.cur=tr.dataset.id;const st=$("#tw").scrollTop;vInv();$("#tw").scrollTop=st;const r=$('tr[data-id="'+S.cur+'"]');if(r)r.focus&&0}
  }
});
$("#view").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.chg&&CHG[t.dataset.chg]){CHG[t.dataset.chg](t);return}
  if(t.dataset.inp&&t.type==="range"){if(S.view!=="win")refresh();return}
  if(t.dataset.act&&t.type==="checkbox"&&ACT[t.dataset.act]){ACT[t.dataset.act](t);return}
  if(t.id==="selAll"){visible().forEach(p=>S.picked[p.id]=t.checked);vInv();return}
  if(t.id==="sortSel"){S.sort={k:t.value,d:t.value==="size"||t.value==="date"?-1:1};vInv();return}
  if(t.id==="dry"){S.prev.dry=t.checked;vPrev();return}
  if(t.dataset.it){S.prev.sel[t.dataset.it]=t.checked;vPrev();return}
  if(t.id==="restoreSel"){S.restore=t.value;persist();return}
});
$("#view").addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.inp&&INP[t.dataset.inp]){INP[t.dataset.inp](t);return}
  if(t.id==="q"){S.q=t.value;const st=window.scrollY,pos=t.selectionStart;vInv();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);window.scrollTo({top:st})}
  else if(t.id==="zp"){const r=checkPath(t.value),z=$("#zr");z.innerHTML=!r?"":r.ok?'<div class="verdict ok">'+lvg(2)+'<div><b>Разрешено</b><div class="note">Путь вне зон. Остаются проверки владельца, SFC и reparse point.</div></div></div>':'<div class="verdict bad">'+lvg(4)+'<div><b>Запрещено</b><div class="note"><span class="mono">'+esc(r.z[0])+'</span><br>'+esc(r.z[1])+'</div></div></div>'}
  else if(t.id==="retR"){S.ret=+t.value;$("#retO").textContent=S.ret+" дн.";persist()}
  else if(t.id==="warnR"){S.warn=+t.value;$("#warnO").textContent=S.warn+" ГБ";persist()}
  else if(t.id==="jdR"){S.jd=+t.value;$("#jdO").textContent=S.jd+" дн.";persist()}
});
let gChord=0;
const G_KEYS={d:"dash",i:"inv",m:"modes",p:"pw",s:"st",c:"sv",r:"reg",e:"fx",w:"win",o:"mon",h:"chg",j:"jrn",q:"qrn"};
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palOpen();return}
  if(!$("#pal").hidden||$("#dlg").open)return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(S.started&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&tag!=="input"&&tag!=="textarea"&&tag!=="select"){
    if(gChord&&Date.now()-gChord<1300){gChord=0;const to=G_KEYS[e.key.toLowerCase()];if(to){e.preventDefault();go(to);return}}
    else if(e.key.toLowerCase()==="g"){gChord=Date.now();return}
  }
  if(e.key==="/"&&S.view==="inv"&&tag!=="input"&&tag!=="textarea"){e.preventDefault();const q=$("#q");if(q)q.focus();return}
  if(S.view==="inv"&&tag!=="input"&&tag!=="textarea"&&tag!=="select"&&["ArrowDown","ArrowUp"," ","Enter"].includes(e.key)){
    const list=visible();if(!list.length)return;let i=list.findIndex(p=>p.id===S.cur);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();i=Math.max(0,Math.min(list.length-1,i+(e.key==="ArrowDown"?1:-1)));S.cur=list[i].id;const st=$("#tw").scrollTop;vInv();$("#tw").scrollTop=st;const r=$('tr[data-id="'+S.cur+'"]');if(r)r.scrollIntoView({block:"nearest"})}
    else if(e.key===" "&&tag!=="button"){e.preventDefault();S.picked[S.cur]=!S.picked[S.cur];const st=$("#tw").scrollTop;vInv();$("#tw").scrollTop=st}
    else if(e.key==="Enter"&&tag!=="button"&&S.cur){S.picked[S.cur]=true;openPrev()}
  }
});

/* ---------- старт ---------- */
seedJournal();
buildNav();
(function init(){
  const h=(location.hash||"").replace("#","");
  if(h&&h!=="start"){
    S.started=true;S.admin=true;
    if(["prev","run","rec"].includes(h)){S.picked={s13:true};openPrev();if(h==="run"){S.prev.dry=true;startRun(allSelected(),true)}if(h==="rec"){S.receipts=[S.journal[0]]}if(h!=="prev")go(h);return}
    if(h==="wat")S.expert=true;
    if(VIEWS.some(v=>v.id===h)){go(h);return}
  }
  go("start");
})();
})();
